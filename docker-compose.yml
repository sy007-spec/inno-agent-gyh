services:
  inno-agent:
    build: .
    # Run as the host dev user (not the image's default root) so files the
    # container writes into the bind-mounted runtime/ and workspace/ dirs
    # (config.json, session logs, L2/L3 databases, ...) stay owned by
    # whoever's actually developing here, instead of flipping to root:root
    # and locking them out of their own editor/IDE. Match this to `id -u`/
    # `id -g` for your dev user if it isn't 1000:1000.
    user: "1000:1000"
    ports:
      - "3000:3000"
    environment:
      INNO_CONFIG_DIR: /etc/inno-agent
      INNO_DATA_DIR: /var/lib/inno-agent/data
      INNO_SKILLS_DIR: /var/lib/inno-agent/skills
      INNO_WORKSPACE_DIR: /srv/inno-workspace
      INNO_PORT: 3000
    volumes:
      - ./runtime/config:/etc/inno-agent
      - ./runtime/data:/var/lib/inno-agent/data
      - ./runtime/skills:/var/lib/inno-agent/skills
      - ./workspace:/srv/inno-workspace
